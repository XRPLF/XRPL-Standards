<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />
    <link rel="icon" href="{{ root }}/assets/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="{{ root }}/assets/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    {% block head %}{% endblock %}
    <script defer src="{{ root }}/assets/site.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header>
      <div class="container">
        <a class="site-title" href="{{ root }}/index.html"
          >XRP Ledger Standards</a
        >
        <nav aria-label="Site">
          <a href="{{ root }}/index.html">All Standards</a>
          <a href="{{ root }}/contribute.html">Contribute</a>
          <a href="{{ repo_url }}">GitHub</a>
        </nav>
      </div>
    </header>

    <main id="main" class="container">{% block content %}{% endblock %}</main>

    <footer>
      <div class="container">
        <p>
          &copy; {{ year }} XRP Ledger Foundation. Licensed under
          <a href="{{ repo_url }}/blob/master/LICENSE">Apache License 2.0</a>.
        </p>
      </div>
    </footer>
  </body>
</html>

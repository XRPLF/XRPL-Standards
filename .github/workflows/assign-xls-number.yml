name: Assign XLS Number

# pull_request_target runs with a write token on fork PRs. Rules for this file:
# - Never check out or run code from the PR head.
# - Never put PR-controlled values (file names, titles) in `run:` or `script:`
#   through ${{ }}. The Python script reads them from the API instead.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] fork PRs need a write token to comment; see rules above
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: assign-xls-number-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspect Added XLS Directories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has_drafts: ${{ steps.inspect.outputs.has_drafts }}
    steps:
      - name: Check out base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Inspect added files
        id: inspect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/assign_xls_number.py inspect

      - name: Find existing warning comment
        if: steps.inspect.outputs.has_self_assigned == 'true'
        id: find-warning-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "Self-Assigned XLS Number Warning"

      - name: Post warning comment
        if: steps.inspect.outputs.has_self_assigned == 'true'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-warning-comment.outputs.comment-id }}
          edit-mode: replace
          body-path: ${{ runner.temp }}/self-assigned-comment.md

  assign:
    name: Assign XLS Number to Draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: inspect
    if: needs.inspect.outputs.has_drafts == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # Serialize assignment across PRs so that two PRs cannot take the same
    # number. Runs that do not add a draft skip this job and never wait here.
    # Limit: GitHub keeps one pending run per group, so a third draft PR that
    # arrives while two wait cancels the older pending one. That PR gets its
    # number on its next push.
    concurrency:
      group: assign-xls-number-reserve
      cancel-in-progress: false
    steps:
      - name: Check for write+ approval
        id: approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            // Use each reviewer's latest review, so a later "changes requested"
            // replaces an earlier approval.
            const latest = new Map();
            for (const r of reviews) {
              if (r.user && r.user.type !== 'Bot' && r.state !== 'COMMENTED') {
                latest.set(r.user.login, r.state);
              }
            }
            for (const [login, state] of latest) {
              if (state !== 'APPROVED') continue;
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo,
                username: login,
              });
              if (['admin', 'maintain', 'write'].includes(data.permission)) {
                core.info(`Write+ approval from ${login} (${data.permission})`);
                core.setOutput('approved', 'true');
                return;
              }
            }
            core.info('No write+ approval yet. Skipping assignment.');
            core.setOutput('approved', 'false');

      # Only for the script. The script reads existing XLS numbers from the
      # live base branch through the API, not from this checkout, so a PR that
      # merged while this job waited is still counted.
      - name: Check out base branch
        if: steps.approval.outputs.approved == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Assign XLS number
        if: steps.approval.outputs.approved == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/assign_xls_number.py assign

      # Add the label before the comment. Other PRs find reservations through
      # this label, so a run cancelled between the two steps must not leave a
      # published number without it. A label without a comment reserves nothing.
      # The label name must match RESERVED_LABEL in assign_xls_number.py.
      - name: Add reservation label
        if: steps.approval.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "has XLS number"

      - name: Find existing assignment comment
        if: steps.approval.outputs.approved == 'true'
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "XLS Number Assignment"

      - name: Post or update assignment comment
        if: steps.approval.outputs.approved == 'true'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body-path: ${{ runner.temp }}/assignment-comment.md

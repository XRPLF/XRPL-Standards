name: Validate XLS Documents

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-xls:
    name: Validate XLS Document Parsing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Parse all XLS documents
        run: python scripts/xls_parser.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Test CI scripts
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Test site scripts
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  validate-xls-template:
    name: "[Beta CI Check] Validate XLS Template Compliance"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Validate changed XLS files
        env:
          # On push, compare with the commit before the push. On a new branch
          # or workflow_dispatch, fall back to the default branch.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="origin/$DEFAULT_BRANCH"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=d "$BASE"...HEAD -- 'XLS-*/README.md' 'XLS-*/*/*.md')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No XLS files changed."
            exit 0
          fi
          printf 'Validating %s\n' "${files[@]}"
          python scripts/validate_xls_template.py "${files[@]}"
